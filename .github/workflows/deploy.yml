name: Deploy React app to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate socket server URL
        env:
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || 'https://multiplayer-clone-socket.onrender.com' }}
        run: |
          case "$VITE_SOCKET_URL" in
            https://*) ;;
            *) echo "::error::Set the VITE_SOCKET_URL Actions variable to your public HTTPS Socket.IO server URL."; exit 1 ;;
          esac

      - name: Build
        env:
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || 'https://multiplayer-clone-socket.onrender.com' }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4